[versions]
agp = "9.3.2"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
room = "2.8.5"
navigation = "2.10.1"
lifecycle = "2.11.0"
fragmentKtx = "1.9.0"
recyclerview = "1.4.0"
# KSP is versioned independently of the Kotlin compiler from 2.3.0 onwards, so this no longer
# has to be kept in lock-step with a Kotlin release.
ksp = "2.3.12"
# Firebase is versioned through a Bill of Materials rather than per-library: the BoM pins one
# tested-together set of versions, so firebase-firestore below deliberately carries no version of
# its own and takes whatever this BoM says. That is what stops two Firebase libraries being
# resolved to versions that were never released as a pair.
firebaseBom = "34.19.0"
# The Gradle plugin that reads app/google-services.json and turns it into the resources the
# Firebase SDK looks up at runtime. Versioned separately from the BoM — it is a build tool, not a
# library the app links against.
googleServices = "4.4.4"
# Adds `await()` for Google Play services Task objects, which is what the Firestore API returns.
# Without it every Firestore call would have to be wrapped in a callback by hand.
coroutinesPlayServices = "1.10.2"
# The fused location provider from Google Play services, used to geotag saved places. This is the
# location library only - the Google Maps SDK is deliberately not a dependency; see
# data.location.LocationRepository.
playServicesLocation = "21.4.0"
# Retrofit turns the Open-Meteo REST endpoint into a Kotlin interface, and its Gson converter turns
# the JSON reply into the response classes. One version for both: the converter is published from the
# same build as Retrofit itself and is not guaranteed to work against a different release.
retrofit = "2.11.0"
# Credential Manager: the Android API that shows the system "choose a Google account" sheet behind
# "Continue with Google". The play-services-auth artifact is the part that talks to Google Play
# services on Android 13 and older, so the two are released together and share one version.
credentials = "1.5.0"
# Google ID: the Google-specific request and result types (GetGoogleIdOption,
# GoogleIdTokenCredential) that Credential Manager returns a Google ID token through.
googleId = "1.1.1"
# TOTP: the one-time-password algorithm behind Google Authenticator (RFC 6238). Deliberately a
# library rather than a hand-written HMAC-SHA1-and-truncate: an authenticator code that is subtly
# wrong fails in a way nobody can debug from the app, and getting the counter, the truncation and the
# Base32 alphabet exactly right is precisely the sort of thing a tested library already does. See
# data.auth.TotpAuthenticator.
totp = "1.7.1"
# Google's libphonenumber: the phone-number rules behind the country-code selector on every form
# that asks for a number. Deliberately a library rather than a hand-written "ten digits" check — the
# number of digits, the valid prefixes and the way a number is grouped differ per country and change
# over time, so per-country rules written by hand are wrong the day they are written and wrong again
# a year later. This is the same metadata Android's own dialler uses. See ui.common.PhoneNumbers.
#
# The plain (non-Android) artifact is used on purpose: it is pure Java with no Context to pass
# around, so the validation rules stay callable from a ViewModel and from an ordinary JVM unit test
# — see PhoneNumbersTest — which the Android port, needing a Context to load its metadata, would not.
libphonenumber = "9.0.19"
# ZXing's core encoder, used to turn the otpauth:// setup URI into a QR code the authenticator app
# scans. `core` only — it produces an abstract BitMatrix of black and white modules with no drawing
# code in it, which util.QrCodeRenderer paints into an Android Bitmap. The companion `javase`
# artifact is deliberately excluded where this is declared: it draws through java.awt, which does not
# exist on Android.
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# Room: runtime is the library itself, ktx adds the coroutine/Flow support the DAOs return,
# and compiler is the annotation processor that generates the DAO implementations via KSP.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Navigation Component: fragment gives the NavHostFragment and navigate() calls, ui wires the
# graph up to app bars and bottom navigation.
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
# Lifecycle: viewModelScope for coroutines in ViewModels, and repeatOnLifecycle for collecting
# flows safely from fragments.
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# fragment-ktx supplies the `by viewModels()` delegate used to obtain ViewModels.
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
# RecyclerView arrives transitively with Material, but the app uses it directly (ListAdapter,
# LinearLayoutManager), so it is declared explicitly rather than relying on another library's
# dependency that could change version without warning.
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# Firebase. The BoM is declared as a platform dependency in app/build.gradle.kts; firestore then
# has no version of its own on purpose, so the BoM decides it.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
# Firebase Authentication, used only for the password-reset email. Versionless for the same reason
# as firestore: the BoM picks a version known to work alongside it.
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
# "Continue with Google": Credential Manager plus Google's ID-token types for it.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
# Retrofit: the HTTP client behind the home screen's live temperature. `converter-gson` is the piece
# that parses the JSON body into WeatherResponse; without a converter Retrofit can only hand back a
# raw response body.
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
# Two-factor authentication: the TOTP algorithm and the QR encoder the setup screen needs.
totp = { group = "dev.samstevens.totp", name = "totp", version.ref = "totp" }
# Phone-number parsing, validation and formatting, per country.
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

